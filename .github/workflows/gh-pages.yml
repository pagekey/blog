name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- 1. BUILD VITE (Homepage) ---
      - name: Cache npm (Vite)
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-vite-${{ hashFiles('package-lock.json') }}

      - name: Install Vite Deps
        run: npm ci

      - name: Build Vite App
        run: npm run build # Outputs to ./dist

      # --- 2. PREPARE DEPLOYMENT ---
      - name: Prepare Deployment
        run: |
          # Create 404.html from index.html for SPA routing on GitHub Pages
          cp ./dist/index.html ./dist/404.html
          
          # Copy content directory so images load properly
          cp -r ./content ./dist/content
          
          # Inject CNAME record back into the final directory
          echo "pagekey.io" > ./dist/CNAME

      # --- 3. DEPLOY ---
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

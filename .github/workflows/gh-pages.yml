name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- 1. BUILD ELEVENTY (Blog) ---
      - name: Cache npm (Root/Eleventy)
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-eleventy-${{ hashFiles('package-lock.json') }}

      - name: Install Eleventy Deps
        run: npm ci

      - name: Build Eleventy
        run: npm run build-ghpages # Outputs to ./_site

      # --- 2. BUILD VITE (Homepage) ---
      - name: Cache npm (Vite)
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-vite-${{ hashFiles('vite/package-lock.json') }}

      - name: Install Vite Deps
        run: cd vite && npm ci

      - name: Build Vite App
        run: cd vite && npm run build # Outputs to ./vite/dist

      # --- 3. STITCH THEM TOGETHER ---
      - name: Merge Codebases
        run: |
          # Copy Vite static files directly into the root of Eleventy's build directory
          cp -r ./vite/dist/* ./_site/
          
          # Inject CNAME record back into the final directory
          echo "pagekey.io" > ./_site/CNAME

      # --- 4. DEPLOY ---
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
